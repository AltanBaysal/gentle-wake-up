name: gentle_wake_up
description: A fully working Flutter alarm app with clear page responsibilities and production-quality UI.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  intl: ^0.18.0
  uuid: ^4.0.0
  provider: ^6.0.0
  just_audio: ^0.9.36
  just_audio_background: ^0.0.1-beta.11
  audio_service: ^0.18.12
  android_alarm_manager_plus: ^4.0.0
  flutter_local_notifications: ^17.0.0
  permission_handler: ^11.0.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
